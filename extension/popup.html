<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 360px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #1d2633; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #1f6fd8; color: #fff; font-weight: 600; }
    header img { width: 20px; height: 20px; }
    section { padding: 10px 14px; border-bottom: 1px solid #eef1f5; }
    label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5f6b7a; margin: 0 0 6px; }
    .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .meta { color: #5f6b7a; font-size: 12px; white-space: nowrap; }
    button { background: #1f6fd8; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
    button:disabled { background: #b9c4d2; cursor: default; }
    .empty { color: #5f6b7a; }
    input[type=number] { width: 56px; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt="">OwnIDM</header>
  <section>
    <label><input type="checkbox" id="enabled"> Enviar las descargas del navegador a OwnIDM</label>
    <label><input type="checkbox" id="videoSite"> Panel de vídeo en <b id="site"></b></label>
    <label>Tamaño mínimo de vídeo <input type="number" id="minMB" min="0" step="1"> MB</label>
  </section>
  <section>
    <h2>Vídeos en esta página</h2>
    <div id="list"></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
